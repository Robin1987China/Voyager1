name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-vue/package-lock.json

      - name: Build frontend
        run: cd web-vue && npm ci && npm run build

      - name: Build backend (skip tests)
        run: rm -f modules/agent/target/agent-*.jar && mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Upload server release artifact
        uses: actions/upload-artifact@v5
        with:
          name: voyager1-server-release
          path: modules/server/target/server-*-release/
          retention-days: 7

      - name: Upload agent release artifact
        uses: actions/upload-artifact@v5
        with:
          name: voyager1-agent-release
          path: modules/agent/target/agent-*-release/
          retention-days: 7
